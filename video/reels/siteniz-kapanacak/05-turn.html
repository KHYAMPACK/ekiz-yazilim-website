<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "SG"; src: url("__FONT__") format("truetype"); font-weight: 300 700; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; background: #000; overflow: hidden; font-family: "SG", sans-serif; color: #fff; }
  #stage { position: absolute; inset: 0; width: 1080px; height: 1920px; transform-origin: 50% 45%; background:
      radial-gradient(900px 700px at 80% 78%, rgba(191,213,235,0.10), rgba(0,0,0,0) 70%), #000; }
  #mark { position: absolute; left: 90px; top: 270px; width: 84px; height: 84px; opacity: 0.55; }
  .word { position: absolute; left: 0; width: 1080px; text-align: center; font-size: 168px; font-weight: 600; letter-spacing: -6px; line-height: 190px; white-space: nowrap;
          transform-origin: 50% 50%; }
  #w1 { top: 640px; }
  #w2 { top: 820px; color: #ff4b3e; }
  #w2t { position: relative; display: inline-block; }
  #strike { position: absolute; left: -2%; top: 50%; height: 16px; margin-top: -2px; width: 0; background: #fff; border-radius: 8px; }

  /* the lookup card from section 4, as it ended */
  #look { position: absolute; left: 90px; top: 560px; width: 900px; padding: 46px 52px 40px; background: #12171d; border: 2px solid #28303a; border-radius: 36px; transform-origin: 50% 0; }
  #look .head { display: flex; align-items: center; gap: 18px; font-size: 32px; letter-spacing: 5px; text-transform: uppercase; color: #bfd5eb; }
  #look .head svg { width: 40px; height: 40px; }
  #field { margin-top: 28px; height: 104px; border-radius: 20px; background: #0b0e12; border: 2px solid #28303a; display: flex; align-items: center; padding: 0 30px; font-size: 52px; }
  #field .dom { filter: blur(12px); }
  #bar { margin-top: 18px; height: 6px; opacity: 0; }
  .row { display: flex; justify-content: space-between; align-items: center; padding: 26px 6px; border-bottom: 2px solid #1e252e; font-size: 46px; }
  .row:last-child { border-bottom: 0; }
  .row .k { color: #93a0ad; }
  .row .v { font-weight: 600; }
  .row .blur { filter: blur(12px); }
  .ok { display: inline-flex; align-items: center; gap: 14px; color: #5cc592; }
  .ok i { width: 18px; height: 18px; border-radius: 50%; background: #5cc592; display: inline-block; }
  #end { margin: 6px -26px 0; padding: 26px 32px; border-radius: 22px; background: rgba(92,197,146,0.18); box-shadow: 0 0 0 3px rgba(92,197,146,0.7); }
  #endv { display: inline-block; transform-origin: 100% 50%; transform: scale(1.18); color: rgb(92,197,146); }
  #oldcap { position: absolute; left: 90px; right: 90px; top: 1360px; text-align: center; font-size: 66px; font-weight: 500; line-height: 1.22; text-wrap: balance; }

  /* the turn */
  #big { position: absolute; left: 80px; right: 80px; top: 1000px; text-align: center; font-size: 104px; font-weight: 600; letter-spacing: -3px; line-height: 1.08; text-wrap: balance; opacity: 0; }
  #big .yes { color: #5cc592; }

  #cap { position: absolute; left: 90px; right: 90px; top: 1400px; height: 220px; font-size: 66px; font-weight: 500; line-height: 1.22; }
  #cap .sent { position: absolute; left: 0; right: 0; top: 0; text-align: center; text-wrap: balance; }
  #cap .sent span { display: inline-block; padding: 0 8px; margin: 0 -4px; border-radius: 4px; }
</style>
</head>
<body>
<div id="stage">
  <svg id="mark" viewBox="0 0 100 100" fill="none">__MARK__</svg>
  <div id="look">
    <div class="head">
      <svg viewBox="0 0 24 24" fill="none" stroke="#bfd5eb" stroke-width="2.4"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21" stroke-linecap="round"/></svg>
      Alan adı sorgusu
    </div>
    <div id="field"><span class="dom">sitenizinadi.com</span></div>
    <div id="bar"></div>
    <div class="row"><span class="k">Durum</span><span class="v ok"><i></i>Aktif</span></div>
    <div class="row"><span class="k">Kayıt firması</span><span class="v blur">Kayıt Firması A.Ş.</span></div>
    <div class="row"><div id="end" style="display:flex;justify-content:space-between;align-items:center;width:100%"><span class="k">Bitiş tarihi</span><span class="v" id="endv">Mayıs 2027</span></div></div>
  </div>
  <div class="word" id="w1">Siteniz</div>
  <div class="word" id="w2"><span id="w2t">kapanacak.<i id="strike"></i></span></div>
  <div id="oldcap">Süresi Mayıs 2027'ye kadar ödenmişti.</div>
  <div id="big">Kapanacak bir şey <span class="yes">yoktu.</span></div>
  <div id="cap"></div>
</div>
<script>
  // TIMING from build.mjs: voiceStart, duration, words.
  const TIMING = __TIMING__;
  const V = TIMING.voiceStart;
  const WORDS = TIMING.words;

  const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  const seg = (t, a, b) => clamp((t - a) / (b - a));
  const easeOut = (x) => 1 - Math.pow(1 - x, 3);
  const easeInOut = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const lerp = (a, b, k) => a + (b - a) * k;
  const $ = (id) => document.getElementById(id);

  __CAPTIONS__
  const captions = makeCaptions($('cap'), WORDS);

  const find = (re) => WORDS.find((w) => re.test(w.text));
  const dogru = find(/^doğru/i) || { start: V + 1.0, end: V + 1.3 };
  const degil = find(/^değildi/i) || { start: V + 1.3, end: V + 1.8 };

  window.draw = function (t) {
    // section 4 ended at 1.02; hold it and drift on slowly
    $('stage').style.transform = `scale(${1.02 + 0.02 * seg(t, 0, TIMING.duration)})`;

    // the lookup card and the old caption step away
    const out = easeInOut(seg(t, 0, 0.35));
    $('look').style.opacity = String(1 - out);
    $('look').style.transform = `translateY(${lerp(0, 30, out)}px) scale(${lerp(1, 0.96, out)})`;
    $('oldcap').style.opacity = String(1 - easeOut(seg(t, 0, 0.2)));

    // the headline comes back down to the middle, bigger
    const h = easeInOut(seg(t, 0.15, 0.75));
    const sc = lerp(0.4, 0.72, h);
    $('w1').style.transform = `translateY(${lerp(-445, -175, h)}px) scale(${sc})`;
    $('w2').style.transform = `translateY(${lerp(-545, -235, h)}px) scale(${sc})`;

    // on "doğru değildi": "kapanacak." is struck through and goes grey
    const s = easeInOut(seg(t, dogru.start, dogru.start + 0.35));
    $('strike').style.width = `${104 * s}%`;
    const g = easeOut(seg(t, dogru.start + 0.1, dogru.start + 0.45));
    $('w2').style.color = `rgb(${Math.round(lerp(255, 120, g))},${Math.round(lerp(75, 128, g))},${Math.round(lerp(62, 138, g))})`;

    // the answer
    const b = easeOut(seg(t, degil.start, degil.start + 0.4));
    $('big').style.opacity = String(b);
    $('big').style.transform = `translateY(${(1 - b) * 40}px)`;

    captions(t);
  };
  window.draw(0);
</script>
</body>
</html>
