<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "SG"; src: url("__FONT__") format("truetype"); font-weight: 300 700; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; background: #000; overflow: hidden; font-family: "SG", sans-serif; color: #fff; }
  #stage { position: absolute; inset: 0; width: 1080px; height: 1920px; transform-origin: 50% 45%; background:
      radial-gradient(900px 700px at 80% 78%, rgba(191,213,235,0.10), rgba(0,0,0,0) 70%), #000; }
  #mark { position: absolute; left: 90px; top: 270px; width: 84px; height: 84px; opacity: 0.55; }

  /* section 6 as it ended */
  #list { position: absolute; left: 90px; right: 70px; top: 720px; display: flex; flex-direction: column; gap: 60px; }
  .item { display: flex; align-items: center; gap: 28px; white-space: nowrap; }
  .item svg { width: 82px; height: 82px; flex: none; }
  .item svg circle { fill: rgba(92,197,146,0.16); stroke: #5cc592; stroke-width: 3; }
  .item svg path { fill: none; stroke: #5cc592; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
  .item span { font-size: 60px; font-weight: 600; letter-spacing: -2px; line-height: 1.05; }
  .item span em { font-style: normal; color: #5cc592; }
  #oldcap { position: absolute; left: 90px; right: 90px; top: 1360px; text-align: center; font-size: 66px; font-weight: 500; line-height: 1.22; text-wrap: balance; }

  /* the question, spoken word by word in large type */
  #q { position: absolute; left: 70px; right: 70px; top: 700px; height: 300px; font-size: 104px; font-weight: 600; letter-spacing: -3px; line-height: 1.1; }
  #q .sent { position: absolute; left: 0; right: 0; top: 0; text-align: center; text-wrap: balance; }
  #q .sent span { display: inline-block; padding: 0 12px; margin: 0 -6px; border-radius: 8px; }

  /* end card */
  #endcard { position: absolute; left: 0; right: 0; top: 1020px; display: flex; flex-direction: column; align-items: center; opacity: 0; }
  #logo { width: 230px; height: 230px; }
  #name { margin-top: 40px; font-size: 84px; font-weight: 600; letter-spacing: -2px; }
  #url { margin-top: 14px; font-size: 48px; color: #e58a5c; letter-spacing: 0.5px; }
</style>
</head>
<body>
<div id="stage">
  <svg id="mark" viewBox="0 0 100 100" fill="none">__MARK__</svg>
  <div id="list">
    <div class="item"><svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="22"/><path d="M14 24.5 21 31.5 34 17"/></svg><span>Alan adı <em>sizin adınıza</em></span></div>
    <div class="item"><svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="22"/><path d="M14 24.5 21 31.5 34 17"/></svg><span>Hosting <em>bizden</em></span></div>
    <div class="item"><svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="22"/><path d="M14 24.5 21 31.5 34 17"/></svg><span>Her masraf <em>yazılı</em></span></div>
  </div>
  <div id="oldcap">Her masraf yazılı.</div>
  <div id="q"></div>
  <div id="endcard">
    <svg id="logo" viewBox="0 0 100 100" fill="none">__MARK__</svg>
    <div id="name">Ekiz Yazılım</div>
    <div id="url">ekizyazilim.com</div>
  </div>
</div>
<script>
  // TIMING from build.mjs: voiceStart, duration, words.
  const TIMING = __TIMING__;
  const V = TIMING.voiceStart;
  const WORDS = TIMING.words;

  const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  const seg = (t, a, b) => clamp((t - a) / (b - a));
  const easeOut = (x) => 1 - Math.pow(1 - x, 3);
  const easeInOut = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const easeOutBack = (x) => { const c1 = 1.2, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
  const lerp = (a, b, k) => a + (b - a) * k;
  const $ = (id) => document.getElementById(id);

  __CAPTIONS__
  // the big question uses the same word-by-word system as the captions
  const question = makeCaptions($('q'), WORDS);

  const hic = WORDS.find((w) => /^hiç$/i.test(w.text)) || { start: V + 1.6 };

  window.draw = function (t) {
    // section 6 ended at 1.02; settle and drift
    $('stage').style.transform = `scale(${lerp(1.02, 1.0, easeInOut(seg(t, 0, 0.6))) + 0.015 * seg(t, 0.6, TIMING.duration)})`;

    // the check list clears
    const out = easeInOut(seg(t, 0, 0.35));
    $('list').style.opacity = String(1 - out);
    $('list').style.transform = `translateY(${-30 * out}px)`;
    $('oldcap').style.opacity = String(1 - easeOut(seg(t, 0, 0.2)));

    // the question; when "Hiç baktınız mı?" starts, it moves up to make room for the end card
    question(t);
    const up = easeInOut(seg(t, hic.start - 0.1, hic.start + 0.45));
    $('q').style.transform = `translateY(${-260 * up}px)`;

    // end card: logo pops, name and site follow; the small corner logo steps aside
    const e = seg(t, hic.start, hic.start + 0.5);
    $('endcard').style.opacity = String(easeOut(e));
    $('logo').style.transform = `scale(${0.6 + 0.4 * easeOutBack(e)})`;
    $('mark').style.opacity = String(0.55 * (1 - easeOut(e)));
    const n = easeOut(seg(t, hic.start + 0.2, hic.start + 0.6));
    $('name').style.opacity = String(n);
    $('name').style.transform = `translateY(${(1 - n) * 24}px)`;
    const u = easeOut(seg(t, hic.start + 0.35, hic.start + 0.75));
    $('url').style.opacity = String(u);
    $('url').style.transform = `translateY(${(1 - u) * 24}px)`;
  };
  window.draw(0);
</script>
</body>
</html>
