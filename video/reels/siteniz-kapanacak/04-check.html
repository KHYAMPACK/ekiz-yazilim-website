<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "SG"; src: url("__FONT__") format("truetype"); font-weight: 300 700; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; background: #000; overflow: hidden; font-family: "SG", sans-serif; color: #fff; }
  #stage { position: absolute; inset: 0; width: 1080px; height: 1920px; transform-origin: 50% 45%; background:
      radial-gradient(900px 700px at 80% 78%, rgba(191,213,235,0.10), rgba(0,0,0,0) 70%), #000; }
  #mark { position: absolute; left: 90px; top: 270px; width: 84px; height: 84px; opacity: 0.55; }
  .word { position: absolute; left: 0; width: 1080px; text-align: center; font-size: 168px; font-weight: 600; letter-spacing: -6px; line-height: 190px; white-space: nowrap;
          transform-origin: 50% 50%; }
  #w1 { top: 640px; transform: translateY(-445px) scale(0.4); }
  #w2 { top: 820px; color: #ff4b3e; transform: translateY(-545px) scale(0.4); }

  /* everything from section 3, as it ended */
  #msggroup { position: absolute; inset: 0; transform-origin: 540px 900px; }
  #who { position: absolute; left: 98px; top: 638px; font-size: 32px; letter-spacing: 5px; text-transform: uppercase; color: #bfd5eb; }
  #card { position: absolute; left: 90px; top: 700px; width: 900px; height: 400px; border-radius: 56px 56px 56px 10px; background: #e8eef4; }
  #msg { position: absolute; left: 56px; right: 56px; top: 50px; color: #0b0d10; font-size: 68px; font-weight: 500; line-height: 1.18; letter-spacing: -1px; }
  #msg .hl { background: rgba(255,75,62,0.38); border-radius: 6px; padding: 0 4px; margin: 0 -4px; }
  #time { position: absolute; right: 44px; bottom: 28px; font-size: 28px; color: #6b7783; }
  #pay { position: absolute; left: 130px; top: 930px; width: 820px; padding: 44px 48px 48px; background: #12171d; border: 2px solid #28303a; border-radius: 36px; }
  #pay .label { font-size: 34px; color: #93a0ad; letter-spacing: 1px; }
  #pay .amount { margin-top: 10px; font-size: 104px; font-weight: 600; letter-spacing: -2px; filter: blur(14px); }
  #btn { margin-top: 30px; height: 120px; border-radius: 22px; background: #ff4b3e; color: #fff; font-size: 56px; font-weight: 600;
         display: flex; align-items: center; justify-content: center; }
  #tap { position: absolute; left: 573px; top: 1148px; width: 74px; height: 74px; border-radius: 50%; background: rgba(255,255,255,0.92); box-shadow: 0 6px 30px rgba(0,0,0,0.5); }
  #pulse { position: absolute; inset: 0; pointer-events: none;
           background: radial-gradient(ellipse at 50% 50%, rgba(255,30,20,0.06) 20%, rgba(255,35,25,0.45) 62%, rgba(255,40,30,0.85) 100%); }
  #oldcap { position: absolute; left: 90px; right: 90px; top: 1380px; text-align: center; font-size: 66px; font-weight: 500; line-height: 1.22; }

  /* the registry lookup */
  #look { position: absolute; left: 90px; top: 560px; width: 900px; padding: 46px 52px 40px; background: #12171d; border: 2px solid #28303a; border-radius: 36px; opacity: 0; }
  #look .head { display: flex; align-items: center; gap: 18px; font-size: 32px; letter-spacing: 5px; text-transform: uppercase; color: #bfd5eb; }
  #look .head svg { width: 40px; height: 40px; }
  #field { margin-top: 28px; height: 104px; border-radius: 20px; background: #0b0e12; border: 2px solid #28303a; display: flex; align-items: center; padding: 0 30px; font-size: 52px; }
  #field .dom { filter: blur(12px); }
  #bar { margin-top: 18px; height: 6px; border-radius: 3px; background: #28303a; overflow: hidden; }
  #bar i { display: block; height: 100%; width: 0; background: #bfd5eb; }
  .row { display: flex; justify-content: space-between; align-items: center; padding: 26px 6px; border-bottom: 2px solid #1e252e; font-size: 46px; opacity: 0; }
  .row:last-child { border-bottom: 0; }
  .row .k { color: #93a0ad; }
  .row .v { font-weight: 600; }
  .row .blur { filter: blur(12px); }
  .ok { display: inline-flex; align-items: center; gap: 14px; color: #5cc592; }
  .ok i { width: 18px; height: 18px; border-radius: 50%; background: #5cc592; display: inline-block; }
  #end { margin: 6px -26px 0; padding: 26px 32px; border-radius: 22px; }
  #endv { display: inline-block; transform-origin: 100% 50%; }

  #cap { position: absolute; left: 90px; right: 90px; top: 1360px; height: 220px; font-size: 66px; font-weight: 500; line-height: 1.22; }
  #cap .sent { position: absolute; left: 0; right: 0; top: 0; text-align: center; text-wrap: balance; }
  #cap .sent span { display: inline-block; padding: 0 8px; margin: 0 -4px; border-radius: 4px; }
</style>
</head>
<body>
<div id="stage">
  <svg id="mark" viewBox="0 0 100 100" fill="none">__MARK__</svg>
  <div class="word" id="w1">Siteniz</div>
  <div class="word" id="w2">kapanacak.</div>
  <div id="msggroup">
    <div id="who">Siteyi yapan kişi</div>
    <div id="card">
      <div id="msg"><span class="hl">Alan adı ücreti</span> ödenmezse siteniz kapatılacak.</div>
      <div id="time">şimdi</div>
    </div>
  </div>
  <div id="pay">
    <div class="label">Alan adı ücreti</div>
    <div class="amount">₺ 4.850,00</div>
    <div id="btn">Öde</div>
  </div>
  <div id="pulse"></div>
  <div id="tap"></div>
  <div id="oldcap">Ödemeye hazırdı.</div>

  <div id="look">
    <div class="head">
      <svg viewBox="0 0 24 24" fill="none" stroke="#bfd5eb" stroke-width="2.4"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21" stroke-linecap="round"/></svg>
      Alan adı sorgusu
    </div>
    <div id="field"><span class="dom">sitenizinadi.com</span></div>
    <div id="bar"><i id="bari"></i></div>
    <div class="row" id="r1"><span class="k">Durum</span><span class="v ok"><i></i>Aktif</span></div>
    <div class="row" id="r2"><span class="k">Kayıt firması</span><span class="v blur">Kayıt Firması A.Ş.</span></div>
    <div class="row" id="r3"><div id="end" style="display:flex;justify-content:space-between;align-items:center;width:100%"><span class="k">Bitiş tarihi</span><span class="v" id="endv">Mayıs 2027</span></div></div>
  </div>

  <div id="cap"></div>
</div>
<script>
  // TIMING from build.mjs: voiceStart, duration, words, plus the heartbeat schedule carried over from section 3.
  const TIMING = __TIMING__;
  const V = TIMING.voiceStart;
  const WORDS = TIMING.words;

  const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  const seg = (t, a, b) => clamp((t - a) / (b - a));
  const easeOut = (x) => 1 - Math.pow(1 - x, 3);
  const easeInOut = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const lerp = (a, b, k) => a + (b - a) * k;
  const $ = (id) => document.getElementById(id);

  __CAPTIONS__
  const captions = makeCaptions($('cap'), WORDS);

  const find = (re) => WORDS.find((w) => re.test(w.text));
  const baktik = find(/^baktık/i) || { start: V + 0.9, end: V + 1.3 };
  const mayis = find(/^mayıs/i) || { start: V + 2.0, end: V + 2.4 };

  // Same heartbeat as section 3 (continues across the cut), faded out over the first 0.6 s.
  const beat = (t, t0) => (t >= t0 ? easeInOut(seg(t, t0, t0 + 0.2)) * Math.exp(-Math.max(0, t - t0 - 0.2) * 3.2) : 0);
  function heart(t) {
    // t in section-3 time
    let b = 0;
    for (let t0 = TIMING.heart.korktu; t0 < TIMING.heart.until; t0 += 0.85) b = Math.max(b, beat(t, t0), 0.75 * beat(t, t0 + 0.28));
    return b;
  }

  window.draw = function (t) {
    const t3 = t + TIMING.heart.prevDuration;      // the same moment on section 3's clock
    const b = heart(t3);
    const fade = 1 - easeInOut(seg(t, 0, 0.6));
    $('pulse').style.opacity = String(clamp(0.45 + 0.6 * b) * fade);

    // stage: section 3 ended at 1.045 (times the beat pump); relax to 1.0, then drift slowly
    const relax = easeInOut(seg(t, 0, 0.8));
    const s = lerp(1.045, 1.0, relax) * (1 + 0.008 * b * fade) + 0.02 * seg(t, 0.8, TIMING.duration);
    $('stage').style.transform = `scale(${s})`;

    // the payment scene fades away in place (short moves only, so nothing slides over the headline)
    const out = easeInOut(seg(t, 0.0, 0.35));
    $('msggroup').style.transform = `translateY(${lerp(-250, -290, out)}px) scale(${lerp(0.8, 0.76, out)})`;
    $('msggroup').style.opacity = String(0.6 * (1 - out));
    $('pay').style.transform = `translateY(${lerp(0, 30, out)}px) scale(${lerp(1, 0.96, out)})`;
    $('pay').style.opacity = String(1 - out);
    $('tap').style.opacity = String(1 - easeOut(seg(t, 0, 0.2)));
    $('oldcap').style.opacity = String(1 - easeOut(seg(t, 0, 0.2)));

    // lookup card comes in
    const lin = easeOut(seg(t, 0.3, 0.75));
    $('look').style.opacity = String(lin);
    $('look').style.transform = `translateY(${(1 - lin) * 80}px)`;

    // searching while he says "Alan adı kaydına baktık"
    $('bari').style.width = `${easeInOut(seg(t, V, baktik.end)) * 100}%`;
    $('bar').style.opacity = String(1 - easeOut(seg(t, baktik.end, baktik.end + 0.25)));

    // results appear one by one after the search
    [['r1', 0.0], ['r2', 0.12], ['r3', 0.24]].forEach(([id, d]) => {
      const k = easeOut(seg(t, baktik.end + d, baktik.end + d + 0.3));
      $(id).style.opacity = String(k);
      $(id).style.transform = `translateY(${(1 - k) * 24}px)`;
    });

    // "Mayıs 2027": the end date lights up
    const hk = easeOut(seg(t, mayis.start - 0.05, mayis.start + 0.3));
    $('end').style.background = `rgba(92,197,146,${0.18 * hk})`;
    $('end').style.boxShadow = `0 0 0 ${3 * hk}px rgba(92,197,146,${0.7 * hk})`;
    $('endv').style.color = hk > 0.01 ? `rgb(${Math.round(lerp(255, 92, hk))},${Math.round(lerp(255, 197, hk))},${Math.round(lerp(255, 146, hk))})` : '#fff';
    $('endv').style.transform = `scale(${1 + 0.18 * hk})`;

    captions(t);
  };
  window.draw(0);
</script>
</body>
</html>
